02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Zilla Slab';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"582196af-8b57-4dd5-8a75-a49fbd380f20\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Zilla Slab';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4e664f1d-6fd7-41d3-aa52-bd68ba5e8365\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Zilla Slab';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"239fba2b-3521-4622-a8f8-78a05c925f4a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; background:#F6F1E6; font-family:Archivo, system-ui, sans-serif; }\n  a { color:#0B0B09; text-decoration:none; }\n  a:hover { color:#5B6B12; }\n  ::selection { background:#D9F24B; color:#0B0B09; }\n<\u002Fstyle>\n<title>Cameron Gawley | Operator, Brand Builder, Co-Founder of FlightPlan Ventures<\u002Ftitle>\n<meta name=\"description\" content=\"Cameron Gawley is a Dallas-based operator with 20+ years building consumer brands. Co-Founder and Managing Partner of FlightPlan Ventures, founder of GLiTCH Candy, former CEO of the DTC agency BuzzShift (double exit), and the fractional CMO who scaled GardenCup from zero to a $29M run rate in 18 months.\">\n<link rel=\"canonical\" href=\"https://flightplan.ventures/cameron-gawley\">\n<meta name=\"robots\" content=\"index, follow, max-image-preview:large\">\n<meta property=\"og:type\" content=\"profile\">\n<meta property=\"og:site_name\" content=\"FlightPlan Ventures\">\n<meta property=\"og:url\" content=\"https://flightplan.ventures/cameron-gawley\">\n<meta property=\"og:title\" content=\"Cameron Gawley | Operator, Brand Builder, Co-Founder of FlightPlan Ventures\">\n<meta property=\"og:image:secure_url\" content=\"https://flightplan.ventures/assets/og-image.png\">\n<meta property=\"og:description\" content=\"20+ years building consumer brands. A double exit as agency CEO. Now Co-Founder and Managing Partner of FlightPlan Ventures, building and incubating consumer brands with real ownership in them.\">\n<meta property=\"og:image\" content=\"https://flightplan.ventures/assets/og-image.png\">\n<meta property=\"og:image:width\" content=\"1200\">\n<meta property=\"og:image:height\" content=\"630\">\n<meta property=\"og:image:alt\" content=\"FlightPlan Ventures: most founders build products, we build brands.\">\n<meta property=\"og:locale\" content=\"en_US\">\n<meta property=\"profile:first_name\" content=\"Cameron\">\n<meta property=\"profile:last_name\" content=\"Gawley\">\n<meta name=\"author\" content=\"Cameron Gawley\">\n<meta name=\"theme-color\" content=\"#0B0B09\">\n<meta name=\"twitter:image\" content=\"https://flightplan.ventures/assets/og-image.png\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Cameron Gawley | Operator and Brand Builder\">\n<meta name=\"twitter:description\" content=\"Co-Founder of FlightPlan Ventures. Founder of GLiTCH Candy. Twenty years building consumer brands, and a double exit as agency CEO.\">\n<script type=\"application/ld+json\">\n{\"@context\":\"https://schema.org\",\"@graph\":[\n{\"@type\":\"Person\",\"@id\":\"https://flightplan.ventures/cameron-gawley#person\",\"name\":\"Cameron Gawley\",\"givenName\":\"Cameron\",\"familyName\":\"Gawley\",\"jobTitle\":\"Co-Founder and Managing Partner, FlightPlan Ventures\",\"description\":\"Dallas-based operator, brand builder and investor with more than 20 years building consumer brands and digital businesses. Co-Founder and Managing Partner of FlightPlan Ventures and founder of GLiTCH Candy. Previously CEO and co-founder of the DTC and CPG agency BuzzShift, a double exit: sold in 2016, bought back in 2017, sold to private equity in 2021. Scaled GardenCup from zero to a $29M run rate in 18 months as fractional CMO.\",\"url\":\"https://flightplan.ventures/cameron-gawley\",\"image\":\"https://cdn.prod.website-files.com/695c59183316497e8f26f0cc/696c783bc0bd7da916b64eb4_Cameron%20Gawley.webp\",\"homeLocation\":{\"@type\":\"Place\",\"name\":\"Dallas, Texas\"},\"worksFor\":[{\"@type\":\"Organization\",\"name\":\"FlightPlan Ventures\",\"url\":\"https://flightplan.ventures/\"},{\"@type\":\"Organization\",\"name\":\"GrowBrands\",\"url\":\"https://growbrands.co/\"}],\"founder\":[{\"@type\":\"Organization\",\"name\":\"GLiTCH Candy\",\"url\":\"https://glitchcandy.co/\"}],\"colleague\":{\"@type\":\"Person\",\"name\":\"Bryan DeLuca\",\"url\":\"https://flightplan.ventures/bryan-deluca\"},\"sameAs\":[\"https://www.camerongawley.com/\",\"https://www.camerongawley.com/about\",\"https://flightplan.ventures/\",\"https://glitchcandy.co/\",\"https://growbrands.co/\"],\"knowsAbout\":[\"Consumer packaged goods\",\"Direct-to-consumer growth\",\"Shopify optimization\",\"Brand strategy\",\"Customer journey design\",\"Product seeding and sampling at scale\",\"Retention and lifetime value\",\"Contribution margin\",\"Strategic partnerships\",\"Capital formation and SPVs\"],\"award\":\"Double exit as CEO and co-founder of BuzzShift, sold 2016, repurchased 2017, sold to private equity 2021\",\"alumniOf\":{\"@type\":\"Organization\",\"name\":\"BuzzShift\",\"foundingDate\":\"2010\",\"description\":\"DTC and CPG digital agency co-founded by Cameron Gawley in 2010. Sold in 2016, bought back in 2017, and sold to private equity in 2021.\"}},\n{\"@type\":\"Organization\",\"@id\":\"https://glitchcandy.co#org\",\"name\":\"GLiTCH Candy\",\"url\":\"https://glitchcandy.co/\",\"description\":\"Protein-infused better-for-you candy brand with 14g of protein and under 2g of sugar per bag. Venture-funded by strategic investors plus friends and family, and the anchor brand of the FlightPlan Ventures portfolio.\",\"foundingDate\":\"2025\",\"slogan\":\"The cheat code that should have always existed.\",\"founder\":{\"@id\":\"https://flightplan.ventures/cameron-gawley#person\"}},\n{\"@type\":\"WebPage\",\"@id\":\"https://flightplan.ventures/cameron-gawley#page\",\"url\":\"https://flightplan.ventures/cameron-gawley\",\"name\":\"Cameron Gawley\",\"about\":{\"@id\":\"https://flightplan.ventures/cameron-gawley#person\"},\"inLanguage\":\"en-US\"},\n{\"@type\":\"FAQPage\",\"@id\":\"https://flightplan.ventures/cameron-gawley#faq\",\"mainEntity\":[\n{\"@type\":\"Question\",\"name\":\"What is the difference between a product and a brand?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"A product competes on price and features. A brand competes on identity, story and community. Here is the uncomfortable version: every product is a commodity, no matter how good you think your formulation is. Someone can copy it, and if it sells, someone will. What cannot be copied is the brand around it. A product is something people buy. A brand is something people belong to, and that feeling is engineered, not accidental.\"}},\n{\"@type\":\"Question\",\"name\":\"What is the biggest mistake you see CPG founders make?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Trying to scale before they deserve to. They get one channel working, usually paid social, and immediately pour gas on it while the foundation is still weak. Soft retention, unclear positioning, no real story. Scaling just exposes every crack faster. The second biggest mistake is building for the customer they wish existed instead of the one who will actually buy at scale. Those two together will drain your runway in six months.\"}},\n{\"@type\":\"Question\",\"name\":\"What happens if it is not working?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"I will tell you. Directly. After twenty years the kindest thing you can do for a founder is tell them the truth early. If the positioning is wrong, if the unit economics do not work, if the market is not there, I would rather have that conversation in month two than month twelve. I am not here to string you along.\"}},\n{\"@type\":\"Question\",\"name\":\"What does operator-led actually mean?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"We do not just give advice, we build with you. A traditional VC writes the check and shows up for board meetings. An agency charges a retainer and optimizes ad spend. We take equity and deploy a full operating team, brand, growth, lifecycle, content, from week one. We are inside the business, not watching from outside.\"}},\n{\"@type\":\"Question\",\"name\":\"How do you actually work with brands?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Equity, almost always. I take ownership and put my team inside the business, so I only win when the brand wins. Separately I coach three brands a quarter, directly, and that number is capped on purpose. Coaching gets you clarity. The full partnership gets you execution. Most brands need both, but you do not have to start with both.\"}},\n{\"@type\":\"Question\",\"name\":\"You keep mentioning $29M in 18 months. How?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"We built GardenCup from zero to $29M in DTC sales on Shopify in eighteen months. The short version: we got the positioning right before spending a dollar on ads, built a retention engine from day one, and refused to be everything to everyone. We picked a lane, owned it completely, and scaled what was already working. No magic. Clarity, systems, and relentless execution.\"}},\n{\"@type\":\"Question\",\"name\":\"What do you mean by attention is rented, brand is owned?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Ads, platforms, algorithms. You control none of them, and the moment you stop paying the traffic stops. Your brand is the asset that compounds. It is what brings people back without a retargeting ad, what makes customers tell their friends, and what keeps you defensible when a competitor shows up with a bigger budget. Building a brand is slower than buying attention. It is also the only part that lasts.\"}},\n{\"@type\":\"Question\",\"name\":\"Do you work with brands already in retail?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, and some of my best work happens here. Brands get into retail and then realize their DTC infrastructure is broken, because wholesale velocity was masking a weak direct business. If you are in retail and DTC is underperforming, that is a positioning and systems problem, not a channel problem. We fix the engine so both sides work.\"}},\n{\"@type\":\"Question\",\"name\":\"What stage should I be at to talk to you?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Anywhere from a formula in your kitchen to eight figures. The track changes, the answer to whether it is a fit does not. What matters is whether the brand deserves to exist and whether you can execute.\"}},\n{\"@type\":\"Question\",\"name\":\"How much equity are we talking about?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Depends on the track. Roughly 20 to 40% on brands we originate, 30 to 50% or more on accelerator deals, and majority when we are building the entire thing from scratch.\"}},\n{\"@type\":\"Question\",\"name\":\"Why did you start GLiTCH Candy?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Because the model has to work on my own money first, and because the candy aisle has not had a real idea in twenty years. GLiTCH is protein-infused candy, 14g of protein and under 2g of sugar per bag, built from a blank page by the same team that backs outside founders. We raised a round from strategics and friends and family, and we are building it to be the next billion dollar candy brand.\"}},\n{\"@type\":\"Question\",\"name\":\"Do you help brands raise capital?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. We build the capital strategy, run our own SPVs deal by deal, and help brands raise the round when they are actually ready for it rather than when they are out of runway.\"}}]}]}\n<\u002Fscript>\n<\u002Fhelmet>\n\n\n<div style=\"background:#F6F1E6;color:#0B0B09;font-family:Archivo, system-ui, sans-serif;overflow-x:hidden;position:relative\">\n\n  <div style=\"position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px clamp(16px,4.4vw,40px);background:rgba(246,241,230,0.92);backdrop-filter:blur(10px)\">\n    <a href=\"index.html\" style=\"width:172px;height:32px;overflow:hidden;flex:none;display:block\">\n      <img data-asset=\"fp-logo\" src=\"8232c936-9957-4099-8f1a-b565cf536dbe\" alt=\"FlightPlan Ventures logo\" style=\"width:192px;height:108px;margin-left:-9px;margin-top:-45px;display:block\">\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:26px;font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase\">\n      <a data-navlink=\"\" href=\"#reality\" style=\"padding:15px 2px;white-space:nowrap\">Reality<\u002Fa>\n      <a data-navlink=\"\" href=\"#work\" style=\"padding:15px 2px;white-space:nowrap\">Work<\u002Fa>\n      <a data-navlink=\"\" href=\"#before\" style=\"padding:15px 2px;white-space:nowrap\">Story<\u002Fa>\n      <a data-navlink=\"\" href=\"#frameworks\" style=\"padding:15px 2px;white-space:nowrap\">Frameworks<\u002Fa>\n      <a data-navlink=\"\" href=\"#beliefs\" style=\"padding:15px 2px;white-space:nowrap\">Beliefs<\u002Fa>\n      <a data-navlink=\"\" href=\"#book\" style=\"padding:15px 2px;white-space:nowrap\">Book<\u002Fa>\n      <a href=\"index.html\" style=\"display:flex;align-items:center;gap:8px;background:#0B0B09;color:#F6F1E6;padding:12px 22px;border-radius:999px;transition:background .3s ease,color .3s ease\" style-hover=\"background:#D9F24B;color:#0B0B09\">FlightPlan <span style=\"font-size:14px\">↗<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:150px clamp(20px,4.4vw,40px) 0\">\n    <div style=\"max-width:1560px;margin:0 auto\">\n      <div data-fade=\"\" style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#6B6659\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#D9F24B;border:1px solid #0B0B09\"><\u002Fspan>\n        Dallas, TX · Operator with skin in the game\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Zilla Slab', serif;font-weight:700;font-size:clamp(56px,12vw,210px);line-height:0.84;letter-spacing:-0.04em;margin:34px 0 0\">\n        Cameron<br>Gawley<span style=\"color:#D9F24B\">.<\u002Fspan>\n      <\u002Fh1>\n      <div data-g=\"hero\" style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);gap:60px;margin-top:56px;align-items:end\">\n        <div>\n          <p style=\"font-family:'Zilla Slab', serif;font-size:clamp(22px,2.6vw,40px);font-weight:600;line-height:1.16;letter-spacing:-0.015em;margin:0;max-width:30ch;text-wrap:pretty\">Twenty years building consumer brands. A double exit as agency CEO. Now co-founder and managing partner of <a href=\"index.html\" style=\"border-bottom:2px solid #D9F24B\">FlightPlan Ventures<\u002Fa>, where we put capital and a full operating team behind founders instead of sending them an invoice.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:38px\">\n            <a href=\"index.html#build\" style=\"display:flex;align-items:center;gap:10px;background:#0B0B09;color:#F6F1E6;padding:18px 30px;border-radius:999px;font-size:15px;font-weight:600;transition:background .3s ease,color .3s ease,transform .3s ease\" style-hover=\"background:#D9F24B;color:#0B0B09;transform:translateY(-3px)\">Work with me <span style=\"font-size:17px\">↗<\u002Fspan><\u002Fa>\n            <a href=\"#book\" style=\"display:flex;align-items:center;gap:10px;border:1px solid rgba(11,11,9,0.3);padding:18px 30px;border-radius:999px;font-size:15px;font-weight:600;transition:background .3s ease,color .3s ease,transform .3s ease\" style-hover=\"background:#0B0B09;color:#F6F1E6;transform:translateY(-3px)\">Schedule coffee with me<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-tilt=\"\" style=\"position:relative;width:100%;aspect-ratio:1.02;border-radius:16px;overflow:hidden;background:#EFE9DA\">\n          <img src=\"7a4ea7fe-6c5d-49e6-a544-375d797cd9cc\" data-asset=\"cam-portrait\" alt=\"Cameron Gawley, co-founder and managing partner of FlightPlan Ventures, in a beige jacket against a light background\" width=\"896\" height=\"1120\" loading=\"eager\" decoding=\"async\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#0B0B09;color:#F6F1E6;padding:110px clamp(20px,4.4vw,40px) 100px;margin-top:120px\">\n    <div style=\"max-width:1560px;margin:0 auto\">\n      <div data-fade=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#D9F24B\">The short answer<\u002Fdiv>\n      <p data-fade=\"\" style=\"font-family:'Zilla Slab', serif;font-size:clamp(24px,3.2vw,54px);font-weight:600;line-height:1.16;letter-spacing:-0.02em;margin:30px 0 0;max-width:44ch;text-wrap:pretty\">Cameron Gawley is a Dallas-based operator and brand builder. He is Co-Founder and Managing Partner of FlightPlan Ventures, a venture studio that funds and operates early-stage consumer brands, and the founder of GLiTCH Candy, the anchor brand of the portfolio. He takes ownership in the brands he builds rather than billing retainers.<\u002Fp>\n      <div data-g=\"stats\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;margin-top:70px;padding-top:40px;border-top:1px solid rgba(246,241,230,0.2)\">\n        <div data-fade=\"\" style=\"display:flex;flex-direction:column\">\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(42px,5vw,84px);font-weight:700;line-height:0.9;letter-spacing:-0.03em\">20+<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6B6659;margin-top:auto;padding-top:12px\">Years building consumer brands<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-fade=\"\" style=\"display:flex;flex-direction:column\">\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(42px,5vw,84px);font-weight:700;line-height:0.9;letter-spacing:-0.03em\">2<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6B6659;margin-top:auto;padding-top:12px\">Exits on BuzzShift. Sold, bought back, sold again<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-fade=\"\" style=\"display:flex;flex-direction:column\">\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(42px,5vw,84px);font-weight:700;line-height:0.9;letter-spacing:-0.03em\">$29M<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6B6659;margin-top:auto;padding-top:12px\">GardenCup, zero to $29M as fractional CMO<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-fade=\"\" style=\"display:flex;flex-direction:column\">\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(42px,5vw,84px);font-weight:700;line-height:0.9;letter-spacing:-0.03em\">10<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#6B6659;margin-top:auto;padding-top:12px\">Brands live in the FlightPlan portfolio<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"reality\" style=\"background:#EFE9DA;padding:130px clamp(20px,4.4vw,40px) 120px\">\n    <div style=\"max-width:1560px;margin:0 auto\">\n      <div data-fade=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#6B6659\">01 / The reality<\u002Fdiv>\n      <h2 data-fade=\"\" style=\"font-family:'Zilla Slab', serif;font-weight:600;font-size:clamp(36px,6vw,92px);line-height:0.98;letter-spacing:-0.03em;margin:26px 0 0;max-width:22ch\">Most consumer brands fail. Almost never on product.<\u002Fh2>\n      <div data-g=\"reality\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px;margin-top:56px;align-items:start\">\n        <div>\n          <p data-fade=\"\" style=\"font-family:'Zilla Slab', serif;font-size:clamp(26px,3.4vw,56px);font-weight:600;line-height:1.08;letter-spacing:-0.02em;margin:0;max-width:20ch\">They fail because the founder is <span style=\"font-style:italic\">alone<\u002Fspan>.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p data-fade=\"\" style=\"font-size:19px;line-height:1.6;color:#37342C;margin:0;max-width:54ch\">You do not die from a lack of vision. You die from a lack of infrastructure. Acquisition costs climb, operations break the second you get real traction, and you are making the biggest decisions of the company's life without the team, the systems, or the data to execute them.<\u002Fp>\n          <p data-fade=\"\" style=\"font-size:19px;line-height:1.6;color:#37342C;margin:22px 0 0;max-width:54ch\">Most first-time founders treat the parts they enjoy, the product and the story, as the actual work. The math, the distribution and the operations get filed as admin to handle later.<\u002Fp>\n          <div data-fade=\"\" style=\"margin-top:38px;padding-top:28px;border-top:1px solid rgba(11,11,9,0.24)\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(24px,3vw,46px);font-weight:600;line-height:1.08;letter-spacing:-0.02em;max-width:26ch\">It is the exact opposite. The math <span style=\"font-style:italic;border-bottom:0.09em solid #D9F24B\">is<\u002Fspan> the work. The product is the part that gets to exist if the math works.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"work\" style=\"padding:130px clamp(20px,4.4vw,40px) 120px\">\n    <div style=\"max-width:1560px;margin:0 auto\">\n      <div data-fade=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#6B6659\">02 / What I actually do<\u002Fdiv>\n      <h2 data-fade=\"\" style=\"font-family:'Zilla Slab', serif;font-weight:600;font-size:clamp(38px,6vw,92px);line-height:0.98;letter-spacing:-0.03em;margin:26px 0 0;max-width:20ch\">Five seats. One job.<\u002Fh2>\n      <div data-g=\"work\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:64px\">\n        <div data-fade=\"\" data-card=\"\" style=\"grid-column:1 / -1;background:#0B0B09;color:#F6F1E6;border-radius:20px;padding:clamp(30px,3.4vw,48px);transition:transform .45s cubic-bezier(.2,.7,.2,1)\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#D9F24B;white-space:nowrap\">Founder<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><span style=\"border:1px solid rgba(246,241,230,0.35);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap\">Funded<\u002Fspan><span style=\"background:#D9F24B;color:#0B0B09;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap\">Anchor brand<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(34px,4.6vw,72px);font-weight:700;line-height:0.96;letter-spacing:-0.02em;margin-top:22px\">GLiTCH Candy<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.6;color:#B9B4A6;margin:18px 0 0;max-width:60ch\">We are building the next billion dollar candy brand, and it is funded. We raised from strategics plus friends and family, because the conviction was easy to sell. We looked at the candy aisle and realized it has been mid since 2003. Everyone accepted that candy had to destroy you, and the healthy alternatives tasted like cardboard or packed 22g of sugar under a green label. So we fixed it. GLiTCH is the cheat code that should have always existed. Protein-infused, better-for-you candy that actually tastes like the stuff you grew up on. With 14g of protein and under 2g of sugar per bag, we did not disrupt the industry. We just stopped compromising. Your 10-year-old self would be very proud of your macros today.<\u002Fp>\n          <a href=\"https://glitchcandy.co\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;margin-top:26px;font-size:15px;font-weight:600;color:#D9F24B\">glitchcandy.co <span style=\"font-size:17px\">↗<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-card=\"\" style=\"background:#0B0B09;color:#F6F1E6;border-radius:20px;padding:clamp(30px,3.4vw,44px);transition:transform .45s cubic-bezier(.2,.7,.2,1)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#D9F24B;white-space:nowrap\">Co-founder<\u002Fspan>\n            <span style=\"border:1px solid rgba(246,241,230,0.35);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap\">Equity<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(28px,3.2vw,46px);font-weight:600;line-height:1.02;margin-top:22px\">FlightPlan Ventures<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#B9B4A6;margin:16px 0 0;max-width:44ch\">The gap in this market was never capital. It was execution. We put capital and a twenty-person operating team behind consumer founders, stand the brand up in 120 days, and stay on as the growth partner. Nearly every brand we look at comes through a relationship I built long before there was a deal to talk about. Your network really is your net worth.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-card=\"\" style=\"border:1px solid rgba(11,11,9,0.16);border-radius:20px;padding:clamp(30px,3.4vw,44px);transition:transform .45s cubic-bezier(.2,.7,.2,1),background .4s ease\" style-hover=\"background:#EFE9DA\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#6B6659;white-space:nowrap\">Founder<\u002Fspan>\n            <span style=\"border:1px solid rgba(11,11,9,0.3);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap\">Education<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(28px,3.2vw,46px);font-weight:600;line-height:1.02;margin-top:22px\">GrowBrands<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#37342C;margin:16px 0 0;max-width:44ch\">A decision engine for consumer founders, not another course. The frameworks I use inside portfolio brands, made usable by operators running their own.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-card=\"\" style=\"border:1px solid rgba(11,11,9,0.16);border-radius:20px;padding:clamp(30px,3.4vw,44px);transition:transform .45s cubic-bezier(.2,.7,.2,1),background .4s ease\" style-hover=\"background:#EFE9DA\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#6B6659;white-space:nowrap\">Fractional CMO<\u002Fspan>\n            <span style=\"border:1px solid rgba(11,11,9,0.3);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap\">$0 to $29M<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(28px,3.2vw,46px);font-weight:600;line-height:1.02;margin-top:22px\">GardenCup<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#37342C;margin:16px 0 0;max-width:44ch\">I came in as fractional CMO, built the brand DNA from the ground up, and scaled it from zero to a $29M run rate in eighteen months. Today I stay involved on partnerships.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-card=\"\" style=\"background:#D9F24B;color:#0B0B09;border:1px solid #0B0B09;border-radius:20px;padding:clamp(30px,3.4vw,44px);transition:transform .45s cubic-bezier(.2,.7,.2,1)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#4A5410;white-space:nowrap\">Advisory<\u002Fspan>\n            <span style=\"border:1px solid #0B0B09;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap\">3 brands a quarter<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(28px,3.2vw,46px);font-weight:600;line-height:1.02;margin-top:22px\">Founder coaching<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#37342C;margin:16px 0 0;max-width:44ch\">Direct coaching for three brands a quarter. That cap is the point. Usually a founder stuck between stages who needs the diagnosis before the spend.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"before\" style=\"background:#0B0B09;color:#F6F1E6;padding:130px clamp(20px,4.4vw,40px) 120px\">\n    <div style=\"max-width:1560px;margin:0 auto\">\n      <div data-g=\"before\" style=\"display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:70px;align-items:start\">\n        <div>\n          <div data-fade=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#D9F24B\">03 / Before FlightPlan<\u002Fdiv>\n          <h2 data-fade=\"\" style=\"font-family:'Zilla Slab', serif;font-weight:600;font-size:clamp(36px,5vw,80px);line-height:0.98;letter-spacing:-0.03em;margin:26px 0 0;max-width:16ch\">I spent eleven years building everyone else's dream.<\u002Fh2>\n        <\u002Fdiv>\n        <div>\n          <p data-fade=\"\" style=\"font-size:19px;line-height:1.6;color:#B9B4A6;margin:0;max-width:56ch\">From 2010 to 2021 I co-founded and ran BuzzShift as CEO, one of the fastest growing DTC and CPG agencies in the country. We sold it in 2016, bought it back in 2017, and sold again to private equity in 2021. A double exit on the same company.<\u002Fp>\n          <p data-fade=\"\" style=\"font-size:19px;line-height:1.6;color:#B9B4A6;margin:22px 0 0;max-width:56ch\">A decade of building other founders' brands teaches you exactly where the model breaks. You do the best work of your life, hand over the deck, and watch it die in a folder because nobody inside the company owned the outcome. The invoice cleared either way.<\u002Fp>\n          <p data-fade=\"\" style=\"font-size:19px;line-height:1.6;color:#B9B4A6;margin:22px 0 0;max-width:56ch\">So we stopped selling the work and started owning it. Same team, same playbook, different incentive. Now we build brands we have equity in, including our own.<\u002Fp>\n          <div data-fade=\"\" style=\"margin-top:44px;padding-top:30px;border-top:1px solid rgba(246,241,230,0.2)\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(28px,3.6vw,60px);font-weight:600;line-height:1.06;letter-spacing:-0.02em;max-width:22ch\">Agencies are <span style=\"font-style:italic;color:#D9F24B\">broken<\u002Fspan>. I know. I built one of the good ones.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showFrameworks }}\" hint-placeholder-val=\"{{ true }}\">\n  <div id=\"frameworks\" style=\"background:#EFE9DA;padding:120px clamp(20px,4.4vw,40px) 110px\">\n    <div style=\"max-width:1560px;margin:0 auto\">\n      <div data-fade=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#6B6659\">04 / The frameworks<\u002Fdiv>\n      <h2 data-fade=\"\" style=\"font-family:'Zilla Slab', serif;font-weight:600;font-size:clamp(38px,6vw,92px);line-height:0.98;letter-spacing:-0.03em;margin:26px 0 0;max-width:24ch\">Strategy without stage is guesswork.<\u002Fh2>\n      <p data-fade=\"\" style=\"font-size:18px;line-height:1.6;color:#37342C;margin:26px 0 0;max-width:52ch\">Most brands do not fail on product. They fail because they scaled the wrong thing at the wrong stage. Everything below exists to answer one question: what is the job right now.<\u002Fp>\n\n      <div data-g=\"matrix\" style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:60px\">\n        <div data-fade=\"\" data-stage=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:14px;padding:26px 22px;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .4s ease,border-color .4s ease\" style-hover=\"transform:translateY(-8px);background:#D9F24B;border-color:#0B0B09\">\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6B6659\">Stage 01<\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(22px,2.1vw,32px);font-weight:600;margin-top:10px;line-height:1\">Foundation<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;margin-top:8px\">$0 to $250K<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.5;color:#37342C;margin:10px 0 0\">Product-market fit, unit economics, the core story. Manual on purpose.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-stage=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:14px;padding:26px 22px;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .4s ease,border-color .4s ease\" style-hover=\"transform:translateY(-8px);background:#D9F24B;border-color:#0B0B09\">\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6B6659\">Stage 02<\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(22px,2.1vw,32px);font-weight:600;margin-top:10px;line-height:1\">Validation<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;margin-top:8px\">$250K to $1M<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.5;color:#37342C;margin:10px 0 0\">Repeat purchase, stable ops, one acquisition channel that actually works.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-stage=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:14px;padding:26px 22px;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .4s ease,border-color .4s ease\" style-hover=\"transform:translateY(-8px);background:#D9F24B;border-color:#0B0B09\">\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6B6659\">Stage 03<\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(22px,2.1vw,32px);font-weight:600;margin-top:10px;line-height:1\">Growth<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;margin-top:8px\">$1M to $3M<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.5;color:#37342C;margin:10px 0 0\">An acquisition engine instead of ad spend. Automation. First real leadership.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-stage=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:14px;padding:26px 22px;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .4s ease,border-color .4s ease\" style-hover=\"transform:translateY(-8px);background:#D9F24B;border-color:#0B0B09\">\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6B6659\">Stage 04<\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(22px,2.1vw,32px);font-weight:600;margin-top:10px;line-height:1\">Scale<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;margin-top:8px\">$3M to $5M<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.5;color:#37342C;margin:10px 0 0\">Margin expansion, accountability, dashboards people actually read.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-stage=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:14px;padding:26px 22px;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .4s ease,border-color .4s ease\" style-hover=\"transform:translateY(-8px);background:#D9F24B;border-color:#0B0B09\">\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6B6659\">Stage 05<\u002Fdiv>\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(22px,2.1vw,32px);font-weight:600;margin-top:10px;line-height:1\">Expansion<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;margin-top:8px\">$5M to $10M+<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.5;color:#37342C;margin:10px 0 0\">New channels, capital strategy, exit readiness. The boring part that pays.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-fade=\"\" style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-top:66px;padding-top:36px;border-top:1px solid rgba(11,11,9,0.2)\">\n        <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(26px,3vw,46px);font-weight:600;line-height:1.05;letter-spacing:-0.02em\">Six things I obsess over.<\u002Fdiv>\n        <div style=\"font-size:15px;color:#6B6659\">No trademarks. Just what actually moves a consumer brand.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-g=\"tools\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px\">\n        <div data-fade=\"\" data-tool=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:16px;padding:clamp(26px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s ease\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(23px,2.2vw,33px);font-weight:600;line-height:1.04;min-width:0\">Unit economics before aesthetics<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.16em;color:#6B6659;white-space:nowrap\">01<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:#37342C;margin:0\">Falling in love with the product before you understand the math is exactly how brands die. Beautiful packaging does not save you when your MOQ forces 50,000 units into a warehouse and COGS eats 40% of margin before a single box ships. We build the model before we build the brand.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-tool=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:16px;padding:clamp(26px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s ease\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(23px,2.2vw,33px);font-weight:600;line-height:1.04;min-width:0\">Clarity over tactics<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.16em;color:#6B6659;white-space:nowrap\">02<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:#37342C;margin:0\">You do not have a traffic problem. You have a trust problem. If people land and do not buy, the answer is not another round of ad creative. The offer is not clear. Confusion kills conversion faster than anything, and if it does not land on a stranger instantly, it does not work.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-tool=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:16px;padding:clamp(26px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s ease\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(23px,2.2vw,33px);font-weight:600;line-height:1.04;min-width:0\">Perception is the product<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.16em;color:#6B6659;white-space:nowrap\">03<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:#37342C;margin:0\">In most categories the products are good enough. You are not competing on features, you are competing on perception. If the brand feels like everyone else, it will perform like everyone else. Most founders are one positioning shift from winning. Finding that shift is the job.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-tool=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:16px;padding:clamp(26px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s ease\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(23px,2.2vw,33px);font-weight:600;line-height:1.04;min-width:0\">Operations are the growth engine<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.16em;color:#6B6659;white-space:nowrap\">04<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:#37342C;margin:0\">Growth does not create problems, it exposes them. Scaling before you have earned it just breaks things faster. The brands that win build clean data, inventory visibility and fulfillment before they need it, then seed product into thousands of the right hands and can actually absorb the demand.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-tool=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:16px;padding:clamp(26px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s ease\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(23px,2.2vw,33px);font-weight:600;line-height:1.04;min-width:0\">The actual customer, not the imaginary one<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.16em;color:#6B6659;white-space:nowrap\">05<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:#37342C;margin:0\">Founders write briefs for the customer they wish they had, the one they picture at a dinner party. That person may exist, but acquiring them breaks your CAC model by month two. I care about the customer who will buy at scale, not the one who validates your taste.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-tool=\"\" style=\"background:#F6F1E6;border:1px solid rgba(11,11,9,0.14);border-radius:16px;padding:clamp(26px,2.6vw,36px);display:flex;flex-direction:column;gap:14px;transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s ease\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(23px,2.2vw,33px);font-weight:600;line-height:1.04;min-width:0\">Chosen without comparison<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.16em;color:#6B6659;white-space:nowrap\">06<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:#37342C;margin:0\">Attention is rented. Brand is owned. When someone is ready to buy they should not open five tabs to compare you. They come straight to you and they come back, which is where the business actually is. You do not need a better product. You need a sharper story.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <\u002Fsc-if>\n\n  <div id=\"beliefs\" style=\"background:#0B0B09;color:#F6F1E6;padding:130px clamp(20px,4.4vw,40px) 120px\">\n    <div style=\"max-width:1560px;margin:0 auto\">\n      <div data-fade=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#D9F24B\">05 / What I believe<\u002Fdiv>\n      <div data-g=\"philosophy\" data-fade=\"\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:40px;padding-bottom:14px\">\n        <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(26px,3vw,50px);font-weight:600;line-height:1.04;letter-spacing:-0.02em\">Brand before <span style=\"font-style:italic;color:#D9F24B\">growth<\u002Fspan>.<\u002Fdiv>\n        <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(26px,3vw,50px);font-weight:600;line-height:1.04;letter-spacing:-0.02em\">Economics before <span style=\"font-style:italic;color:#D9F24B\">scale<\u002Fspan>.<\u002Fdiv>\n        <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(26px,3vw,50px);font-weight:600;line-height:1.04;letter-spacing:-0.02em\">Systems before <span style=\"font-style:italic;color:#D9F24B\">speed<\u002Fspan>.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-g=\"beliefs\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px;margin-top:52px\">\n        <div data-fade=\"\" data-belief=\"\" style=\"padding:38px 0;border-top:1px solid rgba(246,241,230,0.2)\">\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(24px,2.4vw,38px);font-weight:600;line-height:1.1\">If they are not eating when you are not eating, they are a vendor.<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#B9B4A6;margin:14px 0 0;max-width:40ch\">This is why I take equity instead of retainers. Aligned incentives beat good intentions every single time.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-belief=\"\" style=\"padding:38px 0;border-top:1px solid rgba(246,241,230,0.2)\">\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(24px,2.4vw,38px);font-weight:600;line-height:1.1\">Hire for tomorrow, not today.<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#B9B4A6;margin:14px 0 0;max-width:40ch\">Headcount is the easiest way to look busy and the fastest way to get slow. Build the seat before you fill it.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"\" data-belief=\"\" style=\"padding:38px 0;border-top:1px solid rgba(246,241,230,0.2)\">\n          <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(24px,2.4vw,38px);font-weight:600;line-height:1.1\">Boring beats hustle.<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#B9B4A6;margin:14px 0 0;max-width:40ch\">The work that compounds is unglamorous and nobody posts about it. Do it anyway, for longer than feels reasonable.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showFaq }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:#D9F24B;color:#0B0B09;padding:110px clamp(20px,4.4vw,40px) 100px\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div data-fade=\"\" style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase\">06 / Straight answers<\u002Fdiv>\n        <div style=\"font-size:15px;opacity:0.72\">Ask me anything. These come up most.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-fade=\"\" style=\"margin-top:40px\">\n        <div data-faq=\"0\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"0\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">What is the difference between a product and a brand?<\u002Fh3>\n            <span data-faq-icon=\"0\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"0\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">A product competes on price and features. A brand competes on identity, story and community. Here is the uncomfortable version: every product is a commodity, no matter how good you think your formulation is. Someone can copy it, and if it sells, someone will. What cannot be copied is the brand around it. A product is something people buy. A brand is something people belong to, and that feeling is engineered, not accidental.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"1\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"1\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">What is the biggest mistake you see CPG founders make?<\u002Fh3>\n            <span data-faq-icon=\"1\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"1\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Trying to scale before they deserve to. They get one channel working, usually paid social, and immediately pour gas on it while the foundation is still weak. Soft retention, unclear positioning, no real story. Scaling just exposes every crack faster. The second biggest mistake is building for the customer they wish existed instead of the one who will actually buy at scale. Those two together will drain your runway in six months.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"2\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"2\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">What happens if it is not working?<\u002Fh3>\n            <span data-faq-icon=\"2\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"2\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">I will tell you. Directly. After twenty years the kindest thing you can do for a founder is tell them the truth early. If the positioning is wrong, if the unit economics do not work, if the market is not there, I would rather have that conversation in month two than month twelve. I am not here to string you along.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"3\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"3\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">What does operator-led actually mean?<\u002Fh3>\n            <span data-faq-icon=\"3\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"3\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">We do not just give advice, we build with you. A traditional VC writes the check and shows up for board meetings. An agency charges a retainer and optimizes ad spend. We take equity and deploy a full operating team, brand, growth, lifecycle, content, from week one. We are inside the business, not watching from outside.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"4\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"4\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">How do you actually work with brands?<\u002Fh3>\n            <span data-faq-icon=\"4\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"4\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Equity, almost always. I take ownership and put my team inside the business, so I only win when the brand wins. Separately I coach three brands a quarter, directly, and that number is capped on purpose. Coaching gets you clarity. The full partnership gets you execution. Most brands need both, but you do not have to start with both.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"5\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"5\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">You keep mentioning $29M in 18 months. How?<\u002Fh3>\n            <span data-faq-icon=\"5\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"5\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">We built GardenCup from zero to $29M in DTC sales on Shopify in eighteen months. The short version: we got the positioning right before spending a dollar on ads, built a retention engine from day one, and refused to be everything to everyone. We picked a lane, owned it completely, and scaled what was already working. No magic. Clarity, systems, and relentless execution.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"6\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"6\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">What do you mean by attention is rented, brand is owned?<\u002Fh3>\n            <span data-faq-icon=\"6\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"6\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Ads, platforms, algorithms. You control none of them, and the moment you stop paying the traffic stops. Your brand is the asset that compounds. It is what brings people back without a retargeting ad, what makes customers tell their friends, and what keeps you defensible when a competitor shows up with a bigger budget. Building a brand is slower than buying attention. It is also the only part that lasts.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"7\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"7\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">Do you work with brands already in retail?<\u002Fh3>\n            <span data-faq-icon=\"7\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"7\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Yes, and some of my best work happens here. Brands get into retail and then realize their DTC infrastructure is broken, because wholesale velocity was masking a weak direct business. If you are in retail and DTC is underperforming, that is a positioning and systems problem, not a channel problem. We fix the engine so both sides work.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"8\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"8\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">What stage should I be at to talk to you?<\u002Fh3>\n            <span data-faq-icon=\"8\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"8\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Anywhere from a formula in your kitchen to eight figures. The track changes, the answer to whether it is a fit does not. What matters is whether the brand deserves to exist and whether you can execute.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"9\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"9\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">How much equity are we talking about?<\u002Fh3>\n            <span data-faq-icon=\"9\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"9\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Depends on the track. Roughly 20 to 40% on brands we originate, 30 to 50% or more on accelerator deals, and majority when we are building the entire thing from scratch.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"10\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"10\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">Why did you start GLiTCH Candy?<\u002Fh3>\n            <span data-faq-icon=\"10\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"10\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Because the model has to work on my own money first, and because the candy aisle has not had a real idea in twenty years. GLiTCH is protein-infused candy, 14g of protein and under 2g of sugar per bag, built from a blank page by the same team that backs outside founders. We raised a round from strategics and friends and family, and we are building it to be the next billion dollar candy brand.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-faq=\"11\" style=\"border-top:1px solid rgba(11,11,9,0.28)\">\n          <button type=\"button\" data-faq-btn=\"11\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:'Zilla Slab', serif;font-size:clamp(21px,2.5vw,38px);font-weight:600;line-height:1.08;letter-spacing:-0.015em;color:#0B0B09\">\n            <h3 style=\"margin:0;font:inherit;color:inherit;min-width:0\">Do you help brands raise capital?<\u002Fh3>\n            <span data-faq-icon=\"11\" style=\"flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(11,11,9,0.4);display:flex;align-items:center;justify-content:center;font-family:Archivo, sans-serif;font-size:19px;font-weight:400;transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div data-faq-body=\"11\" style=\"overflow:hidden;height:0;transition:height .45s cubic-bezier(.2,.7,.2,1)\">\n            <p style=\"font-size:17px;line-height:1.6;margin:0 0 30px;max-width:62ch\">Yes. We build the capital strategy, run our own SPVs deal by deal, and help brands raise the round when they are actually ready for it rather than when they are out of runway.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-fade=\"\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;margin-top:46px;padding-top:34px;border-top:1px solid rgba(11,11,9,0.28)\">\n        <div style=\"font-family:'Zilla Slab', serif;font-size:clamp(24px,3vw,44px);font-weight:600;line-height:1.06;letter-spacing:-0.02em;max-width:24ch\">Still not sure? That is usually a good sign.<\u002Fdiv>\n        <a href=\"#book\" style=\"display:flex;align-items:center;gap:10px;background:#0B0B09;color:#F6F1E6;padding:20px 34px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap;transition:transform .3s ease,background .3s ease\" style-hover=\"transform:translateY(-3px)\">Book thirty minutes <span style=\"font-size:18px\">↗<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div id=\"book\" style=\"background:#EFE9DA;padding:120px clamp(20px,4.4vw,40px) 110px\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div data-fade=\"\" style=\"font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#6B6659\">07 / Coffee<\u002Fdiv>\n      <h2 data-
